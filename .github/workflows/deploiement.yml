# Vérifie chaque contribution, puis publie sur GitHub Pages depuis la branche main.
# Actions épinglées par empreinte (SHA), permissions minimales.
name: Vérifier et publier

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Audit des dépendances
        run: npm audit --audit-level=high

      - name: Règles de sécurité du code
        run: npm run securite

      - name: Types
        run: npm run check

      # Données BÍN : © Stofnun Árna Magnússonar í íslenskum fræðum, CC BY-SA 4.0.
      # Mises en cache un mois, pour ne pas solliciter le serveur de l'Institut à chaque build.
      - name: Mois courant
        id: mois
        run: echo "valeur=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache BÍN
        id: cache-bin
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .bin
          key: bin-${{ steps.mois.outputs.valeur }}

      - name: Télécharger BÍN
        if: steps.cache-bin.outputs.cache-hit != 'true'
        run: |
          mkdir -p .bin
          curl --fail --location --retry 3 --output .bin/bin.zip \
            "https://bin.arnastofnun.is/django/api/nidurhal/?file=KRISTINsnid.csv.zip"
          unzip -o -q .bin/bin.zip -d .bin
          rm .bin/bin.zip
          ls -la .bin

      - name: Formes islandaises contre BÍN
        run: npm run verifier:bin

      # Audio : Piper (GPL-3.0, build seulement) + voix Talrómur (Université de Reykjavík, CC BY 4.0).
      # Le cache garde les voix et les MP3 déjà produits : seules les phrases nouvelles ou modifiées
      # sont synthétisées.
      - name: Cache audio
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .piper
            static/audio
          key: audio-${{ hashFiles('contenu/**/*.yaml', 'scripts/audio-plan.ts', 'scripts/generer-audio.py', 'scripts/phonetiseur.py', 'scripts/voix_grammatek.py') }}
          restore-keys: audio-

      - name: Préparer Piper
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg)
          python3 -m venv .venv-audio
          .venv-audio/bin/pip install --quiet piper-tts==1.8.0 pyyaml==6.0.3

      # Voix Steinn de Grammatek (Apache-2.0) + dictionnaire de prononciation d'ice-g2p :
      # versions figées, vérifiées par empreinte dans le script.
      - name: Cache Grammatek
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .grammatek
          key: grammatek-${{ hashFiles('scripts/preparer-grammatek.sh') }}

      - name: Préparer la voix Grammatek
        run: bash scripts/preparer-grammatek.sh .grammatek

      - name: Générer l'audio
        run: |
          node scripts/plan-audio.ts > .audio-plan.json
          .venv-audio/bin/python scripts/generer-audio.py .audio-plan.json static/audio .piper .grammatek

      - name: Page d'essais de voix
        run: .venv-audio/bin/python scripts/essais-audio.py static/essais-audio .piper .grammatek .audio-plan.json

      - name: Build (le schéma du contenu est validé ici)
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          EXIGER_AUDIO: '1'

      - name: Liens du site publié
        run: node scripts/verifier-liens.mjs
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - name: Préparer la publication
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  publier:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verifier
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
