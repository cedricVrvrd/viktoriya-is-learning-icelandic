# Viktoriya is learning Icelandic — Niveau 1, Partie 2, Leçon 4
# Licence du contenu : CC BY-SA 4.0
# Texte écrit de zéro à partir de la fiche de structure N1-P2.
# Aucun texte, dialogue, exercice ni personnage du manuel Íslenska fyrir alla.

schema: superpuffin/lecon@1
id: n1-p2-l4
niveau: 1
partie: 2
ordre: 4
duree_minutes: 5
titre:
  fr: "Ça s'écrit comment ?"
  en: "How do you spell it?"
objectif:
  fr: "Épeler son nom avec les noms islandais des lettres, et demander d'épeler."
  en: "Spell your name with the Icelandic letter names, and ask others to spell."
personnages: [kolla, viktoriya]

# ---------------------------------------------------------------------------
# Mots nouveaux (8).
# ---------------------------------------------------------------------------
mots:
  - id: w-stafa
    lemme: "stafa"
    categorie: verbe
    formes: ["stafa", "stafar"]
    fr: "épeler"
    en: "to spell"
  - id: w-hvernig
    lemme: "hvernig"
    categorie: interrogatif
    fr: "comment"
    en: "how"
  - id: w-nafn
    lemme: "nafn"
    categorie: nom
    genre: n
    formes: ["nafnið"]
    fr: "nom, prénom"
    en: "name"
  - id: w-nafnid-mitt
    lemme: "nafnið mitt"
    categorie: expression
    fr: "mon nom"
    en: "my name"
  - id: w-nafnid-thitt
    lemme: "nafnið þitt"
    categorie: expression
    fr: "ton nom"
    en: "your name"
  - id: w-skrifa
    lemme: "skrifa"
    categorie: verbe
    formes: ["skrifa", "skrifar"]
    fr: "écrire"
    en: "to write"
  - id: w-vaff
    lemme: "vaff"
    categorie: nom
    fr: "v (nom de la lettre)"
    en: "v (name of the letter)"
  - id: w-ypsilon
    lemme: "ypsilon"
    categorie: nom
    fr: "y (nom de la lettre)"
    en: "y (name of the letter)"
    note:
      fr: "On l'écrit ypsilon, on le dit souvent « ufsilon »."
      en: "Spelled ypsilon, often said “ufsilon”."

# ---------------------------------------------------------------------------
# Phrases.
# ---------------------------------------------------------------------------
phrases:
  - id: ph-n1p2-042
    is: "Hæ, Viktoriya! Ég skrifa nafnið þitt."
    fr: "Salut, Viktoriya ! J'écris ton nom."
    en: "Hi, Viktoriya! I'm writing your name."
  - id: ph-n1p2-043
    is: "Hvernig stafar þú það?"
    fr: "Comment tu l'épelles ?"
    en: "How do you spell it?"
  - id: ph-n1p2-044
    is: "Vé, i, ka…"
    fr: "(erreur) Vé, i, ka… (à la française)"
    en: "(mistake) Vé, i, ka… (French letter names)"
    erreur_volontaire: true
  - id: ph-n1p2-045
    is: "Nei, nei! Á íslensku: vaff, i, ká."
    fr: "Non, non ! En islandais : vaff, i, ká."
    en: "No, no! In Icelandic: vaff, i, ká."
  - id: ph-n1p2-046
    is: "Vaff, i, ká, té, o, err, i, ypsilon, a."
    fr: "V, i, k, t, o, r, i, y, a."
    en: "V, i, k, t, o, r, i, y, a."
  - id: ph-n1p2-047
    is: "Viktoría? Með í?"
    fr: "Viktoría ? Avec un í ?"
    en: "Viktoría? With an í?"
  - id: ph-n1p2-048
    is: "Nei! Ypsilon, a: Viktoriya!"
    fr: "Non ! Y, a : Viktoriya !"
    en: "No! Y, a: Viktoriya!"
  - id: ph-n1p2-049
    is: "Takk! Og ég heiti Kolla: ká, o, ell, ell, a."
    fr: "Merci ! Et moi, je m'appelle Kolla : k, o, l, l, a."
    en: "Thanks! And my name is Kolla: k, o, l, l, a."

# ---------------------------------------------------------------------------
# Scène d'ouverture : Kolla tient le registre du cours.
# ---------------------------------------------------------------------------
scene:
  lieu: ecole-accueil
  didascalie:
    fr: "À l'accueil de l'école, Kolla aide Bára : elle inscrit les élèves du cours du soir dans un grand registre. C'est au tour de Viktoriya."
    en: "At the school's front desk, Kolla is helping Bára: she's writing the evening-class students into a big register. It's Viktoriya's turn."
  repliques:
    - { locuteur: kolla,     phrase: ph-n1p2-042 }
    - { locuteur: kolla,     phrase: ph-n1p2-043 }
    - { locuteur: viktoriya, phrase: ph-n1p2-044 }
    - { locuteur: kolla,     phrase: ph-n1p2-045 }
    - { locuteur: viktoriya, phrase: ph-n1p2-046 }
    - { locuteur: kolla,     phrase: ph-n1p2-047 }
    - { locuteur: viktoriya, phrase: ph-n1p2-048 }
    - { locuteur: kolla,     phrase: ph-n1p2-049 }

# ---------------------------------------------------------------------------
# Carte de grammaire.
# ---------------------------------------------------------------------------
explication:
  id: gr-stafa
  introduite_par: viktoriya
  question:
    fr: "Pour épeler, je dis les lettres comme en français ?"
    en: "To spell, do I say the letters like in English?"
  reponse:
    fr: "Non : chaque lettre a son nom islandais. Les voyelles se disent comme elles sonnent (a, á, i, í…), les consonnes ont un nom court : bé, dé, eff, ká, ell, err, vaff… Et « stafa » (épeler) se conjugue comme « tala » : ég stafa, þú stafar."
    en: "No: each letter has its Icelandic name. Vowels are said as they sound (a, á, i, í…), consonants have short names: bé, dé, eff, ká, ell, err, vaff… And “stafa” (to spell) works like “tala”: ég stafa, þú stafar."
  tableau:
    - { is: "ég stafa",                fr: "j'épelle",                en: "I spell" }
    - { is: "þú stafar",               fr: "tu épelles",              en: "you spell" }
    - { is: "Hvernig stafar þú það?",  fr: "Comment tu l'épelles ?",  en: "How do you spell it?" }
    - { is: "vaff, ká, ell, err",      fr: "v, k, l, r",              en: "v, k, l, r" }

# ---------------------------------------------------------------------------
# Exercices (10). Trois dictées : un prénom, un pays, un mot de la Partie 1.
# ---------------------------------------------------------------------------
exercices:
  - id: ex-n1p2l4-01
    type: reconnaitre
    support: audio_et_texte
    question: ph-n1p2-043
    consigne:
      fr: "Que demande Kolla ?"
      en: "What is Kolla asking?"
    choix:
      - { fr: "Comment tu l'épelles ?",   en: "How do you spell it?", correct: true }
      - { fr: "Comment tu t'appelles ?",  en: "What's your name?" }
      - { fr: "D'où viens-tu ?",          en: "Where are you from?" }

  - id: ex-n1p2l4-02
    type: dictee
    consigne:
      fr: "Écoute Kolla épeler son prénom, puis écris-le."
      en: "Listen to Kolla spelling her name, then write it."
    a_epeler: "Kolla"
    sens: { fr: "le prénom de la brebis", en: "the sheep's name" }
    tolerance:
      accents: exiger
      ponctuation_finale: ignorer
      majuscule_initiale: ignorer

  - id: ex-n1p2l4-03
    type: retrouver
    consigne:
      fr: "Comment s'appelle la lettre v ?"
      en: "What is the letter v called?"
    choix:
      - { is: "vaff", correct: true }
      - { is: "eff" }
      - { is: "ell" }

  - id: ex-n1p2l4-04
    type: retrouver
    consigne:
      fr: "Et la lettre k ?"
      en: "And the letter k?"
    choix:
      - { is: "ká", correct: true }
      - { is: "kú" }
      - { is: "ge" }

  - id: ex-n1p2l4-05
    type: accorder
    consigne:
      fr: "Choisis la bonne forme."
      en: "Pick the right form."
    phrase_a_trous: "Hvernig ___ þú það?"
    choix:
      - { is: "stafar", correct: true }
      - { is: "stafa" }
    explication: gr-stafa

  - id: ex-n1p2l4-06
    type: associer
    consigne:
      fr: "Relie les paires."
      en: "Match the pairs."
    paires:
      - { mot: w-stafa }
      - { mot: w-hvernig }
      - { mot: w-nafn }
      - { mot: w-skrifa }
      - { mot: w-nafnid-mitt }

  - id: ex-n1p2l4-07
    type: ecouter_dialogue
    repliques:
      - { locuteur: viktoriya, phrase: ph-n1p2-044 }
      - { locuteur: kolla,     phrase: ph-n1p2-045 }
    consigne:
      fr: "Pourquoi Kolla interrompt-elle Viktoriya ?"
      en: "Why does Kolla interrupt Viktoriya?"
    choix:
      - { fr: "Elle épelle avec les noms français des lettres.", en: "She spells with French letter names.", correct: true }
      - { fr: "Elle parle trop vite.",                           en: "She speaks too fast." }
      - { fr: "Elle se trompe de prénom.",                       en: "She gives the wrong name." }

  - id: ex-n1p2l4-08
    type: dictee
    consigne:
      fr: "Écoute, puis écris le nom de ce pays."
      en: "Listen, then write the name of this country."
    a_epeler: "Ísland"
    sens: { fr: "Islande", en: "Iceland" }
    tolerance:
      accents: exiger
      ponctuation_finale: ignorer
      majuscule_initiale: ignorer

  - id: ex-n1p2l4-09
    type: construire
    consigne:
      fr: "Remets dans l'ordre : « Comment tu l'épelles ? »"
      en: "Put in order: “How do you spell it?”"
    blocs: ["Hvernig", "stafar", "þú", "það", "?"]
    reponse: ph-n1p2-043

  - id: ex-n1p2l4-10
    type: produire
    consigne:
      fr: "Demande à Kolla comment elle épelle son prénom, en islandais."
      en: "Ask Kolla how she spells her name, in Icelandic."
    reponses_acceptees: ["Hvernig stafar þú það?", "Hvernig stafarðu það?", "Hvernig stafar þú nafnið þitt?", "Hvernig stafarðu nafnið þitt?"]
    tolerance:
      accents: signaler
      ponctuation_finale: ignorer
      majuscule_initiale: ignorer

fin:
  locuteur: kolla
  message:
    fr: "Bravo ! Te voilà inscrite, avec un ypsilon. Au prochain cours, Bára regarde ce qu'il y a dans ton sac."
    en: "Well done! You're signed up, with a y. Next class, Bára looks at what's in your bag."
