# Viktoriya is learning Icelandic — Niveau 1, Partie 2, Leçon 1
# Licence du contenu : CC BY-SA 4.0
# Texte écrit de zéro à partir de la fiche de structure N1-P2.
# Aucun texte, dialogue, exercice ni personnage du manuel Íslenska fyrir alla.

schema: superpuffin/lecon@1
id: n1-p2-l1
niveau: 1
partie: 2
ordre: 1
duree_minutes: 4
titre:
  fr: "Þ comme þorn"
  en: "Þ as in þorn"
objectif:
  fr: "Reconnaître les lettres islandaises que le français n'a pas."
  en: "Recognise the Icelandic letters that English doesn't have."
personnages: [superpuffin, viktoriya]

# ---------------------------------------------------------------------------
# Mots nouveaux (6). Leçon de lettres : peu de mots, beaucoup d'oreille.
# ---------------------------------------------------------------------------
mots:
  - id: w-skoli
    lemme: "skóli"
    categorie: nom
    genre: m
    formes: ["skólinn"]
    fr: "école"
    en: "school"
  - id: w-stafrof
    lemme: "stafróf"
    categorie: nom
    genre: n
    formes: ["stafrófið"]
    fr: "alphabet"
    en: "alphabet"
  - id: w-stafur
    lemme: "stafur"
    categorie: nom
    genre: m
    fr: "lettre (de l'alphabet)"
    en: "letter (of the alphabet)"
  - id: w-thorn
    lemme: "þorn"
    categorie: nom
    fr: "þ (nom de la lettre)"
    en: "þ (name of the letter)"
    note:
      fr: "Se prononce comme le th de l'anglais « think »."
      en: "Sounds like the th in “think”."
  - id: w-ed
    lemme: "eð"
    categorie: nom
    fr: "ð (nom de la lettre)"
    en: "ð (name of the letter)"
    note:
      fr: "Se prononce comme le th de l'anglais « this ». Jamais en début de mot."
      en: "Sounds like the th in “this”. Never at the start of a word."
  - id: w-eins-og
    lemme: "eins og"
    categorie: expression
    fr: "comme (pour comparer)"
    en: "like, as (comparing)"

# ---------------------------------------------------------------------------
# Phrases.
# ---------------------------------------------------------------------------
phrases:
  - id: ph-n1p2-001
    is: "Halló, Viktoriya! Þetta er skólinn."
    fr: "Salut, Viktoriya ! Voici l'école."
    en: "Hi, Viktoriya! This is the school."
  - id: ph-n1p2-002
    is: "Halló! Og hvað er þetta?"
    fr: "Salut ! Et ça, qu'est-ce que c'est ?"
    en: "Hi! And what's this?"
  - id: ph-n1p2-003
    is: "Þetta er stafrófið."
    fr: "C'est l'alphabet."
    en: "This is the alphabet."
  - id: ph-n1p2-004
    is: "Og þetta er pé?"
    fr: "(erreur) Et ça, c'est un p ?"
    en: "(mistake) And this is a p?"
    erreur_volontaire: true
  - id: ph-n1p2-005
    is: "Nei, nei! Þetta er þorn, eins og í þú."
    fr: "Non, non ! C'est þorn, comme dans « þú »."
    en: "No, no! That's þorn, as in “þú”."
  - id: ph-n1p2-006
    is: "Þorn! Og þetta?"
    fr: "Þorn ! Et ça ?"
    en: "Þorn! And this?"
  - id: ph-n1p2-007
    is: "Þetta er eð, eins og í hvað."
    fr: "C'est eð, comme dans « hvað »."
    en: "That's eð, as in “hvað”."
  - id: ph-n1p2-008
    is: "Og æ og ö?"
    fr: "Et æ et ö ?"
    en: "And æ and ö?"
  - id: ph-n1p2-009
    is: "Æ eins og í sæll, ö eins og í frönsku."
    fr: "Æ comme dans « sæll », ö comme dans « frönsku »."
    en: "Æ as in “sæll”, ö as in “frönsku”."
  - id: ph-n1p2-010
    is: "En þetta?"
    fr: "Et ça ?"
    en: "And these?"
  - id: ph-n1p2-011
    is: "Sé, kú, tvöfalt vaff og seta. Ekki í íslensku!"
    fr: "C, q, w et z. Pas en islandais !"
    en: "C, q, w and z. Not in Icelandic!"
  - id: ph-n1p2-012
    is: "Þetta er þorn."
    fr: "C'est la lettre þ."
    en: "That's the letter þ."

# ---------------------------------------------------------------------------
# Scène d'ouverture : devant l'école de Seyðisfjörður.
# ---------------------------------------------------------------------------
scene:
  lieu: ecole-seydisfjordur
  didascalie:
    fr: "Devant l'école de Seyðisfjörður, une grande affiche montre des lettres. Viktoriya s'arrête : certaines lui sont inconnues. Superpuffin se pose sur l'affiche, pile à côté du þ."
    en: "Outside the school in Seyðisfjörður, a big poster shows letters. Viktoriya stops: she has never seen some of them. Superpuffin lands on the poster, right next to the þ."
  repliques:
    - { locuteur: superpuffin, phrase: ph-n1p2-001 }
    - { locuteur: viktoriya,   phrase: ph-n1p2-002 }
    - { locuteur: superpuffin, phrase: ph-n1p2-003 }
    - { locuteur: viktoriya,   phrase: ph-n1p2-004 }
    - { locuteur: superpuffin, phrase: ph-n1p2-005 }
    - { locuteur: viktoriya,   phrase: ph-n1p2-006 }
    - { locuteur: superpuffin, phrase: ph-n1p2-007 }
    - { locuteur: viktoriya,   phrase: ph-n1p2-008 }
    - { locuteur: superpuffin, phrase: ph-n1p2-009 }
    - { locuteur: viktoriya,   phrase: ph-n1p2-010 }
    - { locuteur: superpuffin, phrase: ph-n1p2-011 }

# ---------------------------------------------------------------------------
# Carte de grammaire.
# ---------------------------------------------------------------------------
explication:
  id: gr-stafrofid
  introduite_par: viktoriya
  question:
    fr: "Il me manque des lettres, et il y en a que je ne connais pas !"
    en: "Some letters are missing, and some I've never seen!"
  reponse:
    fr: "L'alphabet islandais a 32 lettres. Quatre n'existent pas en français : þ, ð, æ et ö. Les voyelles avec accent (á, é, í, ó, ú, ý) sont des lettres à part entière, rangées juste après la même voyelle sans accent. C, q, w et z ne servent que pour les mots étrangers."
    en: "The Icelandic alphabet has 32 letters. Four don't exist in English: þ, ð, æ and ö. Vowels with an accent (á, é, í, ó, ú, ý) are letters in their own right, filed just after the same vowel without one. C, q, w and z only appear in foreign words."
  tableau:
    - { is: "þorn", fr: "þ : th de l'anglais « think »", en: "þ: th as in “think”" }
    - { is: "eð",   fr: "ð : th de l'anglais « this »",  en: "ð: th as in “this”" }
    - { is: "æ",    fr: "æ : « aï », comme dans « aïe »", en: "æ: like “eye”" }
    - { is: "ö",    fr: "ö : eu, comme dans « peur »",   en: "ö: like the u in “fur”" }

# ---------------------------------------------------------------------------
# Exercices (10).
# ---------------------------------------------------------------------------
exercices:
  - id: ex-n1p2l1-01
    type: reconnaitre
    support: audio_et_texte
    question: ph-n1p2-003
    consigne:
      fr: "Que montre Superpuffin ?"
      en: "What is Superpuffin showing?"
    choix:
      - { fr: "L'alphabet",  en: "The alphabet", correct: true }
      - { fr: "L'école",     en: "The school" }
      - { fr: "Un livre",    en: "A book" }

  - id: ex-n1p2l1-02
    type: reconnaitre
    support: audio_et_texte
    question: ph-n1p2-012
    consigne:
      fr: "De quelle lettre parle-t-on ?"
      en: "Which letter is this about?"
    choix:
      - { fr: "þ", en: "þ", correct: true }
      - { fr: "p", en: "p" }
      - { fr: "ð", en: "ð" }

  - id: ex-n1p2l1-03
    type: retrouver
    consigne:
      fr: "Comment s'appelle la lettre ð ?"
      en: "What is the letter ð called?"
    choix:
      - { is: "eð", correct: true }
      - { is: "þorn" }
      - { is: "dé" }

  - id: ex-n1p2l1-04
    type: associer
    consigne:
      fr: "Relie les paires."
      en: "Match the pairs."
    paires:
      - { mot: w-thorn }
      - { mot: w-ed }
      - { mot: w-stafur }
      - { mot: w-stafrof }
      - { mot: w-skoli }

  - id: ex-n1p2l1-05
    type: reconnaitre
    support: texte
    question: ph-n1p2-003
    consigne:
      fr: "Combien de lettres compte l'alphabet islandais ?"
      en: "How many letters does the Icelandic alphabet have?"
    choix:
      - { fr: "32", en: "32", correct: true }
      - { fr: "26", en: "26" }
      - { fr: "36", en: "36" }

  - id: ex-n1p2l1-06
    type: ecouter_dialogue
    repliques:
      - { locuteur: viktoriya,   phrase: ph-n1p2-010 }
      - { locuteur: superpuffin, phrase: ph-n1p2-011 }
    consigne:
      fr: "Que dit Superpuffin de c, q, w et z ?"
      en: "What does Superpuffin say about c, q, w and z?"
    choix:
      - { fr: "Ils ne servent pas en islandais.", en: "They aren't used in Icelandic.", correct: true }
      - { fr: "Ce sont des voyelles.",            en: "They are vowels." }
      - { fr: "Ce sont les lettres préférées de Blesi.", en: "They are Blesi's favourite letters." }

  - id: ex-n1p2l1-07
    type: retrouver
    consigne:
      fr: "Comment s'appelle la lettre þ ?"
      en: "What is the letter þ called?"
    choix:
      - { is: "þorn", correct: true }
      - { is: "té" }
      - { is: "eð" }

  - id: ex-n1p2l1-08
    type: construire
    consigne:
      fr: "Remets dans l'ordre : « C'est l'alphabet. »"
      en: "Put in order: “This is the alphabet.”"
    blocs: ["Þetta", "er", "stafrófið", "."]
    reponse: ph-n1p2-003

  - id: ex-n1p2l1-09
    type: produire
    consigne:
      fr: "Écris en islandais : « Voici l'école. »"
      en: "Write in Icelandic: “This is the school.”"
    reponses_acceptees: ["Þetta er skólinn."]
    tolerance:
      accents: signaler
      ponctuation_finale: ignorer
      majuscule_initiale: ignorer

  - id: ex-n1p2l1-10
    type: dictee
    consigne:
      fr: "Écoute les noms des lettres, puis écris le mot."
      en: "Listen to the letter names, then write the word."
    a_epeler: "þú"
    sens: { fr: "tu", en: "you" }
    tolerance:
      accents: exiger
      ponctuation_finale: ignorer
      majuscule_initiale: ignorer

fin:
  locuteur: superpuffin
  message:
    fr: "Bravo ! Þ et ð n'ont plus de secret pour toi. Prochaine étape : les voyelles, avec Bára."
    en: "Well done! Þ and ð hold no secrets for you now. Next up: vowels, with Bára."
