schema: superpuffin/lecon@1
id: n1-p1-l7
niveau: 1
partie: 1
ordre: 7
duree_minutes: 5
titre:
  fr: "Qui est-ce ?"
  en: "Who's that?"
objectif:
  fr: "Présenter quelqu'un : son nom, son origine, ses langues."
  en: "Introduce someone: their name, where they're from, what they speak."
personnages: [superpuffin, viktoriya]

mots:
