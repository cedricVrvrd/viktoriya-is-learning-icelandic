# Viktoriya is learning Icelandic — Niveau 1, Partie 1, Leçon 2
# Licence du contenu : CC BY-SA 4.0
# Texte écrit de zéro à partir de la fiche de structure N1-P1.
# Aucun texte, dialogue, exercice ni personnage du manuel Íslenska fyrir alla.

schema: superpuffin/lecon@1
id: n1-p1-l2
niveau: 1
partie: 1
ordre: 2
duree_minutes: 4
titre:
  fr: "Sæll ou sæl ?"
  en: "Sæll or sæl?"
objectif:
  fr: "Saluer poliment, selon l'heure et la personne."
  en: "Greet politely, by time of day and by who you talk to."
personnages: [superpuffin, viktoriya]

# ---------------------------------------------------------------------------
# Mots nouveaux (8 expressions). Rappels de la leçon 1 : halló, já, nei, takk, en.
# ---------------------------------------------------------------------------
mots:
  - id: w-godan-daginn
    lemme: "góðan daginn"
    categorie: expression
    fr: "bonjour"
    en: "good morning, hello"
    note:
      fr: "La formule la plus courante, surtout le matin."
      en: "The most common greeting, especially in the morning."
  - id: w-godan-dag
    lemme: "góðan dag"
    categorie: expression
    fr: "bonjour (plus soutenu)"
    en: "good day (more formal)"
  - id: w-gott-kvold
    lemme: "gott kvöld"
    categorie: expression
    fr: "bonsoir"
    en: "good evening"
  - id: w-goda-kvoldid
    lemme: "góða kvöldið"
    categorie: expression
    fr: "bonsoir (plus chaleureux)"
    en: "good evening (warmer)"
  - id: w-komdu-saell
    lemme: "komdu sæll"
    categorie: expression
    registre: soutenu
    fr: "bonjour (à un homme)"
    en: "hello (to a man)"
  - id: w-komdu-sael
    lemme: "komdu sæl"
    categorie: expression
    registre: soutenu
    fr: "bonjour (à une femme)"
    en: "hello (to a woman)"
  - id: w-vertu-saell
    lemme: "vertu sæll"
    categorie: expression
    registre: soutenu
    fr: "au revoir (à un homme)"
    en: "goodbye (to a man)"
  - id: w-vertu-sael
    lemme: "vertu sæl"
    categorie: expression
    registre: soutenu
    fr: "au revoir (à une femme)"
    en: "goodbye (to a woman)"

# ---------------------------------------------------------------------------
# Phrases. Identifiants globaux à la Partie 1, à la suite de la leçon 1.
# ---------------------------------------------------------------------------
phrases:
  - id: ph-n1p1-012
    is: "Góðan daginn, Superpuffin!"
    fr: "Bonjour, Superpuffin !"
    en: "Good morning, Superpuffin!"
  - id: ph-n1p1-013
    is: "Góðan dag, Viktoriya. Komdu sæl!"
    fr: "Bonjour, Viktoriya. Bonjour à toi !"
    en: "Good day, Viktoriya. Hello to you!"
  - id: ph-n1p1-015
    is: "Komdu sæl, Superpuffin!"
    fr: "(erreur) Bonjour, Superpuffin ! (comme à une femme)"
    en: "(mistake) Hello, Superpuffin! (as if to a woman)"
    erreur_volontaire: true
  - id: ph-n1p1-016
    is: "Nei, nei! Komdu sæll!"
    fr: "Non, non ! « Komdu sæll » : je suis un monsieur !"
    en: "No, no! “Komdu sæll”: I'm a gentleman!"
  - id: ph-n1p1-017
    is: "Komdu sæll, Superpuffin!"
    fr: "Bonjour, Superpuffin !"
    en: "Hello, Superpuffin!"
  - id: ph-n1p1-018
    is: "Komdu sæl, Viktoriya!"
    fr: "Bonjour, Viktoriya ! (à une femme)"
    en: "Hello, Viktoriya! (to a woman)"
  - id: ph-n1p1-019
    is: "Vertu sæl, Viktoriya!"
    fr: "Au revoir, Viktoriya ! (à une femme)"
    en: "Goodbye, Viktoriya! (to a woman)"
  - id: ph-n1p1-021
    is: "Gott kvöld, Viktoriya!"
    fr: "Bonsoir, Viktoriya !"
    en: "Good evening, Viktoriya!"
  - id: ph-n1p1-022
    is: "Góða kvöldið, Superpuffin!"
    fr: "Bonsoir, Superpuffin !"
    en: "Good evening, Superpuffin!"
  - id: ph-n1p1-023
    is: "Vertu sæll, Superpuffin!"
    fr: "Au revoir, Superpuffin !"
    en: "Goodbye, Superpuffin!"

# ---------------------------------------------------------------------------
# Scène : le lendemain matin, sur le chemin du fjord.
# ---------------------------------------------------------------------------
scene:
  lieu: chemin-fjord
  didascalie:
    fr: "Le lendemain matin, sur le chemin qui longe le fjord. Superpuffin attend Viktoriya, perché sur un piquet de clôture. Elle est bien décidée à être polie."
    en: "Next morning, on the path along the fjord. Superpuffin is waiting for Viktoriya on a fence post. She is determined to be polite."
  repliques:
    - { locuteur: viktoriya,   phrase: ph-n1p1-012 }
    - { locuteur: superpuffin, phrase: ph-n1p1-013 }
    - { locuteur: viktoriya,   phrase: ph-n1p1-015 }
    - { locuteur: superpuffin, phrase: ph-n1p1-016 }
    - { locuteur: viktoriya,   phrase: ph-n1p1-017 }
    - { locuteur: superpuffin, phrase: ph-n1p1-018 }
    - { locuteur: viktoriya,   phrase: ph-n1p1-023 }
    - { locuteur: superpuffin, phrase: ph-n1p1-019 }

# ---------------------------------------------------------------------------
# Carte de grammaire, introduite par Viktoriya.
# ---------------------------------------------------------------------------
explication:
  id: gr-saell-sael
  introduite_par: viktoriya
  question:
    fr: "Pourquoi sæll pour toi, et sæl pour moi ?"
    en: "Why sæll for you, but sæl for me?"
  reponse:
    fr: "Sæll veut dire « heureux ». Il s'accorde avec la personne à qui tu parles : sæll pour un homme, sæl pour une femme. Komdu sæll, c'est « viens heureux » ; vertu sæll, « reste heureux »."
    en: "Sæll means “happy”. It agrees with the person you are talking to: sæll for a man, sæl for a woman. Komdu sæll is “come happy”; vertu sæll, “stay happy”."
  tableau:
    - { is: "komdu sæll", fr: "bonjour, à un homme", en: "hello, to a man" }
    - { is: "komdu sæl", fr: "bonjour, à une femme", en: "hello, to a woman" }
    - { is: "vertu sæll", fr: "au revoir, à un homme", en: "goodbye, to a man" }
    - { is: "vertu sæl", fr: "au revoir, à une femme", en: "goodbye, to a woman" }

# ---------------------------------------------------------------------------
# Exercices (10).
# ---------------------------------------------------------------------------
exercices:
  - id: ex-n1p1l2-01
    type: reconnaitre
    support: audio_et_texte
    question: ph-n1p1-012
    consigne:
      fr: "Que dit Viktoriya ?"
      en: "What does Viktoriya say?"
    choix:
      - { fr: "Bonjour, Superpuffin !", en: "Good morning, Superpuffin!", correct: true }
      - { fr: "Bonsoir, Superpuffin !", en: "Good evening, Superpuffin!" }
      - { fr: "Au revoir, Superpuffin !", en: "Goodbye, Superpuffin!" }

  - id: ex-n1p1l2-02
    type: associer
    consigne:
      fr: "Relie les paires."
      en: "Match the pairs."
    paires:
      - { mot: w-godan-daginn }
      - { mot: w-gott-kvold }
      - { mot: w-komdu-saell }
      - { mot: w-vertu-sael }

  - id: ex-n1p1l2-03
    type: accorder
    consigne:
      fr: "Tu salues Superpuffin. Choisis la bonne forme."
      en: "You greet Superpuffin. Pick the right form."
    phrase_a_trous: "Komdu ___, Superpuffin!"
    choix:
      - { is: "sæll", correct: true }
      - { is: "sæl" }
    explication: gr-saell-sael

  - id: ex-n1p1l2-04
    type: accorder
    consigne:
      fr: "Tu salues Anna, une voisine. Choisis la bonne forme."
      en: "You greet Anna, a neighbour. Pick the right form."
    phrase_a_trous: "Komdu ___, Anna!"
    choix:
      - { is: "sæl", correct: true }
      - { is: "sæll" }
    explication: gr-saell-sael

  - id: ex-n1p1l2-05
    type: accorder
    consigne:
      fr: "Tu dis au revoir à Viktoriya. Choisis la bonne forme."
      en: "You say goodbye to Viktoriya. Pick the right form."
    phrase_a_trous: "Vertu ___, Viktoriya!"
    choix:
      - { is: "sæl", correct: true }
      - { is: "sæll" }
    explication: gr-saell-sael

  - id: ex-n1p1l2-06
    type: retrouver
    consigne:
      fr: "Comment dit-on : « Bonsoir ! »"
      en: "How do you say: “Good evening!”"
    choix:
      - { is: "Gott kvöld!", correct: true }
      - { is: "Góðan dag!" }
      - { is: "Vertu sæll!" }

  - id: ex-n1p1l2-07
    type: ecouter_dialogue
    repliques:
      - { locuteur: superpuffin, phrase: ph-n1p1-021 }
      - { locuteur: viktoriya,   phrase: ph-n1p1-022 }
    consigne:
      fr: "C'est le matin ou le soir ?"
      en: "Is it morning or evening?"
    choix:
      - { fr: "Le soir", en: "Evening", correct: true }
      - { fr: "Le matin", en: "Morning" }

  - id: ex-n1p1l2-08
    type: construire
    consigne:
      fr: "Remets dans l'ordre : « Au revoir, Superpuffin ! »"
      en: "Put in order: “Goodbye, Superpuffin!”"
    blocs: ["Vertu", "sæll", ",", "Superpuffin", "!"]
    reponse: ph-n1p1-023

  - id: ex-n1p1l2-09
    type: produire
    consigne:
      fr: "Salue Superpuffin poliment, en islandais."
      en: "Greet Superpuffin politely, in Icelandic."
    reponses_acceptees: ["Komdu sæll!", "Komdu sæll, Superpuffin!"]
    tolerance:
      accents: signaler
      ponctuation_finale: ignorer
      majuscule_initiale: ignorer

  - id: ex-n1p1l2-10
    type: produire
    consigne:
      fr: "Dis au revoir poliment à Anna, en islandais."
      en: "Say goodbye politely to Anna, in Icelandic."
    reponses_acceptees: ["Vertu sæl!", "Vertu sæl, Anna!"]
    tolerance:
      accents: signaler
      ponctuation_finale: ignorer
      majuscule_initiale: ignorer

fin:
  locuteur: superpuffin
  message:
    fr: "Bravo ! Retiens bien : moi, c'est « komdu sæll ». Toi, c'est « komdu sæl »."
    en: "Well done! Remember: for me, it's “komdu sæll”. For you, it's “komdu sæl”."
