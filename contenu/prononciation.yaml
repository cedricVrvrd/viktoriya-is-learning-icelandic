# Prononciations des mots absents du dictionnaire de prononciation standard (ice-g2p, Grammatek).
# Notation SAMPA islandaise, symboles séparés par des espaces, comme dans ce dictionnaire.
# Chaque entrée est à faire valider par un locuteur natif.
- mot: heitirðu
  sampa: "h ei: t I r D Y"
  note: "forme contractée de « heitir þú » ; à valider"
- mot: superpuffin
  sampa: "s u: p E r p_h a f I n"
  note: "nom du personnage, lu à l'islandaise ; à valider"
- mot: viktoriya
  sampa: "v I x t O r i j a"
  note: "même prononciation que « Viktoría » dans le dictionnaire"
- mot: stóllinn
  sampa: "s t ou t l I n"
  note: "stóll + article -inn ; ll devant voyelle = [tl], comme dans « Kolla » ; à valider"
- mot: bollinn
  sampa: "p O t l I n"
  note: "bolli + article -nn ; à valider"
- mot: blesi
  sampa: "p l E: s I"
  note: "nom du cheval ; b initial non aspiré, comme dans « bolli » ; à valider"
- mot: pétursson
  sampa: "p_h j E: t Y r_0 s O n"
  note: "« péturs » + « son », comme « pétursdóttir » et « jónsson » dans le dictionnaire ; à valider"
# Noms de lettres pour épeler (src/lib/lettres.ts), absents du dictionnaire.
# Construits sur le modèle des noms présents (bé, pé, té, eff, enn, ell) et de mots voisins.
- mot: dé
  sampa: "t j E:"
  note: "nom de la lettre d, comme « bé » [p j E:] ; à valider"
- mot: ge
  sampa: "c E:"
  note: "nom de la lettre g ; g mouillé devant e, comme dans « gera » ; à valider"
- mot: ká
  sampa: "k_h au:"
  note: "nom de la lettre k, comme « kát » ; à valider"
- mot: emm
  sampa: "E m"
  note: "nom de la lettre m, comme « eff », « enn » ; à valider"
- mot: err
  sampa: "E r"
  note: "nom de la lettre r ; à valider"
- mot: ess
  sampa: "E s"
  note: "nom de la lettre s ; à valider"
- mot: ypsilon
  sampa: "Y f s I l O n"
  note: "nom de la lettre y ; le dictionnaire donne cette prononciation sous la graphie « ufsilon »"
- mot: þorn
  sampa: "T O r t n_0"
  note: "nom de la lettre þ ; rn final comme dans « horn », « korn » ; à valider"
- mot: sé
  sampa: "s j E:"
  note: "nom de la lettre c (lettre étrangère) ; à valider"
- mot: stafróf
  sampa: "s t a v r ou: v"
  note: "staf- comme dans « stafrænn », -róf comme « próf » ; à valider"
- mot: stafrófið
  sampa: "s t a v r ou: v I D"
  note: "stafróf + article -ið, comme « prófið » ; à valider"
- mot: au
  sampa: "9i:"
  note: "la diphtongue citée seule, comme au début de « auga » [9i: G a]"
- mot: sérhljóði
  sampa: "s j E r_0 l_0 j ou: D I"
  note: "sér + hljóði ; r assourdi devant hl, première voyelle raccourcie dans le composé ; à valider"
- mot: samhljóði
  sampa: "s a m l_0 j ou: D I"
  note: "sam + hljóði, comme « sérhljóði » ; à valider"
- mot: pók
  sampa: "p_h ou: k"
  note: "faux mot opposé à « bók » [p ou: k] : même son, avec le souffle du p"
- mot: stafarðu
  sampa: "s t a: v a r D Y"
  note: "forme contractée de « stafar þú », comme « heitirðu » ; à valider"
- mot: blýantur
  sampa: "p l i: a n t Y r"
  note: "blý + antur ; à valider"
- mot: orðabókin
  sampa: "O r D a p ou c I n"
  note: "« orðabók » du dictionnaire + article -in, comme « bókin » ; à valider"
- mot: stílabók
  sampa: "s t i: l a p ou k"
  note: "stíl + a + bók, sur le modèle de « orðabók » ; à valider"
- mot: stílabókin
  sampa: "s t i: l a p ou c I n"
  note: "stílabók + article -in ; à valider"
- mot: taflan
  sampa: "t_h a p l a n"
  note: "« tafla » + article -n ; à valider"
- mot: taskan
  sampa: "t_h a s k a n"
  note: "« taska » + article -n ; à valider"
- mot: tölvinn
  sampa: "t_h 9 l v I n"
  note: "forme fautive volontaire (article masculin sur un nom féminin), distracteur d'exercice"
- mot: tölvið
  sampa: "t_h 9 l v I D"
  note: "forme fautive volontaire (article neutre sur un nom féminin), distracteur d'exercice"
- mot: regnhlíf
  sampa: "r E k n_0 l_0 i: f"
  note: "regn + hlíf, comme les deux mots du dictionnaire ; à valider"
- mot: penninn
  sampa: "p_h E t n I n"
  note: "« penni » [p_h E t n I] du dictionnaire + article -nn ; à valider"
- mot: kalt
  sampa: "k_h a l_0 t"
  note: "l assourdi devant t, comme dans « allt » [a l_0 t] ; à valider"
