# Mots du contenu absents de BÍN, acceptés par le test. Chaque entrée doit être justifiée.
# BÍN décrit les mots qui se déclinent ou se conjuguent : certains mots invariables ou noms propres n'y sont pas.
- mot: Superpuffin
  raison: nom du personnage principal, invariable
- mot: Viktoriya
  raison: prénom étranger du personnage, invariable
- mot: heitirðu
  raison: forme contractée de « heitir þú », propre à l'oral ; BÍN ne liste pas les contractions
- mot: Pétursson
  raison: patronyme (Pétur + s + son), exemple de la carte culture ; BÍN ne recense pas tous les patronymes
- mot: Pétursdóttir
  raison: patronyme (Pétur + s + dóttir), exemple de la carte culture
- mot: son
  raison: suffixe patronymique, affiché seul dans un exercice à trou (Péturs___)
- mot: in
  raison: terminaison de l'article défini féminin, affichée seule dans un exercice à trou (bók___)
- mot: ið
  raison: terminaison de l'article défini neutre, affichée seule dans un exercice à trou (borð___)
- mot: ö
  raison: nom de la lettre ö, cité seul (carte de l'alphabet, Partie 2)
- mot: a
  raison: voyelle citée seule (« Á er ekki a »), Partie 2, leçon 2
- mot: au
  raison: diphtongue citée seule (« Au, eins og í Austri »), Partie 2, leçon 2
- mot: ja
  raison: faute volontaire de Viktoriya, qui lit « já » sans l'accent (Partie 2, leçon 2)
- mot: oga
  raison: faute volontaire de Viktoriya, qui lit « auga » à la française (Partie 2, leçon 2)
- mot: tetta
  raison: faute volontaire de Viktoriya, qui lit « þetta » avec un t (Partie 2, leçon 3)
- mot: pók
  raison: faux mot, opposé à « bók » pour faire entendre p et b (Partie 2, leçon 3)
